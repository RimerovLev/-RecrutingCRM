name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  bot-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tg_bot
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Stage tests (offline)
        run: python tests/run_stage_tests.py

      - name: Unit tests
        run: pytest tests/test_unit.py -q

      - name: RLS static tests
        run: python tests/test_rls.py
